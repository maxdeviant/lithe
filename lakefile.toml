name = "lithe"
version = "0.1.0"
defaultTargets = ["Lithe"]

[[require]]
name = "leanscript"
git = "https://github.com/maxdeviant/leanscript"
rev = "v0.1.0"

[[lean_lib]]
name = "Lithe"
srcDir = "src"

# Macro tests, and helpers for the programs in `tests/dom`.
[[lean_lib]]
name = "LitheTest"
srcDir = "tests"

# Checks that `Lithe.Core` links and works in a native program.
[[lean_exe]]
name = "lithe-native-test"
srcDir = "tests"
root = "LitheNativeTest"
